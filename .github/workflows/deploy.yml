name: Deploy Portfolio

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: weather/weather-app
        run: npm install

      - name: Build Weather App
        working-directory: weather/weather-app
        run: npm run build

      - name: Prepare Pages
        run: |
          mkdir -p public
          cp -r weather/weather-app/dist public/weather

          cp -r todolist public/
          cp -r quiz public/
          cp -r calculator public/
          cp -r login public/

          if [ -f index.html ]; then
            cp index.html public/
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
