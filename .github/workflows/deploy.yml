name: Deploy React to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portfolio-site/portfolio-site/package-lock.json

      - name: Install Portfolio dependencies
        working-directory: ./portfolio-site/portfolio-site
        run: npm ci

      - name: Build React Portfolio
        working-directory: ./portfolio-site/portfolio-site
        run: npm run build

      - name: Build Weather App
        working-directory: ./weather/weather-app
        run: |
          npm ci
          npm run build

      - name: Copy Projects
        run: |
          cp -r todolist portfolio-site/portfolio-site/dist/
          cp -r calculator-new portfolio-site/portfolio-site/dist/
          cp -r login portfolio-site/portfolio-site/dist/
          cp -r Quizify portfolio-site/portfolio-site/dist/
          cp -r moonlight portfolio-site/portfolio-site/dist/
          cp -r resume portfolio-site/portfolio-site/dist/
          cp -r weather/weather-app/dist portfolio-site/portfolio-site/dist/weather

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./portfolio-site/portfolio-site/dist

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
