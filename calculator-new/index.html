<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calculator">
        <div>
            <input type="text" class="display" id="inputBox" disabled>
            <div>
                <!--سظر اول-->
                <button>9</button>
                <button>8</button>
                <button>7</button>
              
  <button class="clear">C</button>
             
                   <!--سظر دوم-->
                <button>6</button>
                <button>5</button>
                <button>4</button>
                <button class="btn">*</button>

                <!--سظر سوم-->
                <button>3</button>
                <button>2</button>
                <button>1</button>
                <button class="btn">-</button>

                <!--سظر چهارم-->
                <button>0</button>
              <button>.</button>
                <button class="equals">=</button>
                <button class="btn">+</button>

                <!--کلیر-->
              

            </div>
        </div>

        <script src="calculator.js"></script>


    </div>
</body>

</html>
